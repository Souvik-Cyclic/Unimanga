name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  docker:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t unimanga-backend:${{ github.sha }} backend

      - name: Smoke test image
        run: |
          docker run -d --name unimanga-ci -p 8000:8000 \
            -e MONGO_URI=mongodb://127.0.0.1:27017/unimanga \
            -e JWT_SECRET=ci-secret-key-for-smoke-test-only \
            -e PORT=8000 \
            unimanga-backend:${{ github.sha }}
          sleep 5
          docker logs unimanga-ci
          docker rm -f unimanga-ci
